<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Manage Rooms | Yashaswini's Hotel</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><a class="brand" href="index.html">Yashaswini<span>Stay</span></a><nav><a href="admin-dashboard.html">Dashboard</a><a href="manage-bookings.html">Bookings</a></nav></header><main class="section"><div class="section-heading"><p class="eyebrow">ROOM MANAGEMENT</p><h1>Manage Hotel Rooms</h1><p>Add new rooms or update existing room information.</p></div><form id="roomForm" class="admin-form"><input type="hidden" name="room_id"><label>Room number<input name="room_number" required></label><label>Room type<input name="room_type" placeholder="Single / Double / Deluxe" required></label><label>Price per night<input name="price" type="number" min="0" step="0.01" required></label><label>Capacity<input name="capacity" type="number" min="1" required></label><label>Status<select name="status"><option>Available</option><option>Maintenance</option></select></label><div class="form-actions"><button class="btn btn-primary" type="submit">Save Room</button><button class="btn btn-outline" type="reset" id="clearRoom">Clear</button></div></form><p id="message" class="message"></p><div id="roomsTable" class="table-wrap"></div></main><script src="js/admin.js"></script></body></html>
