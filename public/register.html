<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Customer Registration | Yashaswini's Hotel</title><link rel="stylesheet" href="css/style.css"></head><body>
<header class="site-header"><a class="brand" href="index.html">Yashaswini<span>Stay</span></a><nav><a href="index.html">Home</a><a href="rooms.html">Rooms</a><a href="login.html">Login</a></nav></header>
<main class="form-page"><form id="registerForm" class="form-card"><p class="eyebrow">CREATE AN ACCOUNT</p><h1>Customer Registration</h1><label>Full name<input name="name" required maxlength="100" autocomplete="name"></label><label>Email address<input name="email" type="email" required autocomplete="email"></label><label>Phone number<input name="phone" required maxlength="15" autocomplete="tel"></label><label>Password<input name="password" type="password" required minlength="8" autocomplete="new-password"></label><button class="btn btn-primary full" type="submit">Create Account</button><p id="message" class="message"></p><p class="form-note">Already registered? <a href="login.html">Login here</a></p></form></main><script src="js/auth.js"></script></body></html>
